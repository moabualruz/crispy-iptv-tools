name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.actor == github.repository_owner
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "generic"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features
      - name: cargo doc
        run: cargo doc --no-deps
      - name: cargo package
        run: cargo package
